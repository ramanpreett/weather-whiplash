<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6002B"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  
  <!-- Grid Lines -->
  <path d="M0,100 L800,100 M0,200 L800,200 M0,300 L800,300 M0,400 L800,400" stroke="#E6002B" stroke-width="1" opacity="0.05"/>
  <path d="M200,0 L200,500 M400,0 L400,500 M600,0 L600,500" stroke="#E6002B" stroke-width="1" opacity="0.05"/>

  <!-- Glowing aura -->
  <ellipse cx="400" cy="300" rx="250" ry="80" fill="#E6002B" opacity="0.2" filter="blur(30px)"/>
  
  <!-- F1 Car Silhouette Profile (Abstract Speed Form) -->
  <!-- Nose cone & front wing -->
  <path d="M 680,310 L 750,330 L 750,340 L 650,340 Z" fill="#b3001e"/>
  
  <!-- Main Body -->
  <path d="M 150,320 
           L 150,280 
           L 220,280 
           L 300,240 
           L 420,230 
           L 480,250 
           L 580,280 
           L 700,310 
           L 700,340
           L 150,340 Z" fill="url(#carRed)"/>
           
  <!-- Driver cockpit -->
  <path d="M 380,230 L 450,200 L 480,250 Z" fill="#000"/>
           
  <!-- Rear Wing -->
  <path d="M 120,290 L 120,200 L 220,200 L 220,280 Z" fill="#b3001e"/>
  <rect x="100" y="190" width="130" height="15" fill="#E6002B"/>
  <rect x="100" y="240" width="120" height="10" fill="#E6002B"/>
  
  <!-- Ground effect underbody -->
  <rect x="150" y="340" width="550" height="10" fill="#111"/>
  
  <!-- Wheels -->
  <!-- Rear Wheel -->
  <circle cx="240" cy="310" r="60" fill="#111" stroke="#333" stroke-width="8"/>
  <circle cx="240" cy="310" r="30" fill="#222"/>
  <circle cx="240" cy="310" r="10" fill="#E6002B"/>
  
  <!-- Front Wheel -->
  <circle cx="620" cy="310" r="50" fill="#111" stroke="#333" stroke-width="8"/>
  <circle cx="620" cy="310" r="25" fill="#222"/>
  <circle cx="620" cy="310" r="8" fill="#E6002B"/>
  
  <!-- Speed Lines -->
  <path d="M 0,380 L 800,380" stroke="#E6002B" stroke-width="2" opacity="0.4"/>
  <path d="M 50,400 L 750,400" stroke="#E6002B" stroke-width="1" opacity="0.2"/>
  <path d="M -50,250 L 300,250" stroke="#fff" stroke-width="2" opacity="0.1"/>
  <path d="M -100,310 L 150,310" stroke="#E6002B" stroke-width="4" opacity="0.5" filter="url(#glow)"/>
</svg>
